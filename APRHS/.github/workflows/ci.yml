name: APRHS CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'APRHS/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'APRHS/**'

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APRHS/frontend
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: APRHS/frontend/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: npm run lint || true
    
    - name: Build
      run: npm run build
    
    - name: Run tests
      run: npm test || true

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APRHS/backend
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true
    
    - name: Test Triage Service
      run: |
        cd ai-services/triage-service
        python -m pytest . || true
    
    - name: Test Vision Service
      run: |
        cd ai-services/vision-service
        python -m pytest . || true
    
    - name: Test NLU Service
      run: |
        cd ai-services/nlu-voice-service
        python -m pytest . || true

  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    if: github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker images
      run: |
        cd APRHS
        docker-compose build || true
    
    - name: Test Docker Compose
      run: |
        cd APRHS
        docker-compose config || true

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: 'APRHS'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true
