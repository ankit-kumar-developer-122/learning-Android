version: '3.8'

services:
  # CouchDB for data sync
  couchdb:
    image: couchdb:3.3
    container_name: aprhs-couchdb
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
    ports:
      - "5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
    networks:
      - aprhs-network
    restart: unless-stopped

  # Triage Service
  triage-service:
    build:
      context: ./backend/ai-services/triage-service
      dockerfile: Dockerfile
    container_name: aprhs-triage
    environment:
      - COUCHDB_URL=http://couchdb:5984
    ports:
      - "8001:8001"
    depends_on:
      - couchdb
    networks:
      - aprhs-network
    restart: unless-stopped

  # Vision Service
  vision-service:
    build:
      context: ./backend/ai-services/vision-service
      dockerfile: Dockerfile
    container_name: aprhs-vision
    environment:
      - COUCHDB_URL=http://couchdb:5984
    ports:
      - "8002:8002"
    depends_on:
      - couchdb
    networks:
      - aprhs-network
    restart: unless-stopped

  # NLU/Voice Service
  nlu-voice-service:
    build:
      context: ./backend/ai-services/nlu-voice-service
      dockerfile: Dockerfile
    container_name: aprhs-nlu
    environment:
      - COUCHDB_URL=http://couchdb:5984
    ports:
      - "8003:8003"
    depends_on:
      - couchdb
    networks:
      - aprhs-network
    restart: unless-stopped

  # Frontend (PWA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aprhs-frontend
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_COUCHDB_URL=http://localhost:5984
    ports:
      - "3000:3000"
    depends_on:
      - triage-service
      - vision-service
      - nlu-voice-service
    networks:
      - aprhs-network
    restart: unless-stopped

  # Nginx API Gateway (optional)
  nginx:
    image: nginx:alpine
    container_name: aprhs-gateway
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:8000"
    depends_on:
      - triage-service
      - vision-service
      - nlu-voice-service
    networks:
      - aprhs-network
    restart: unless-stopped

networks:
  aprhs-network:
    driver: bridge

volumes:
  couchdb_data:
    driver: local
